[project]
name = "pharma-ci-engine"
version = "0.1.0"
description = "Multi-therapeutic-area pharma competitive-intelligence engine"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",   # domain schema + structured-output extraction (v2)
    "google-genai",  # Gemini SDK — LLM structured-output extraction
    # Phase 3 RAG (Stage A2a): hybrid chunk retrieval.
    "faiss-cpu",     # dense vector index (build/persist/load)
    "rank-bm25",     # keyword/BM25 leg of hybrid retrieval
    "fastembed",     # local, quota-free embeddings (isolated in src/rag/embeddings.py)
    # Phase 4 tools: live external API clients.
    "httpx>=0.27",   # HTTP client for ClinicalTrials.gov v2 + openFDA (src/tools/)
]

# Phase-scoped deps are added when their phase starts (see ARCHITECTURE.md
# "Build order"): pdfplumber (deferred with PDF ingestion).

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
pythonpath = ["."]   # retires the root conftest.py sys.path shim
testpaths = ["tests"]
